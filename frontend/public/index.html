<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Assistant debug: floating create button (temporary) -->
    <button id="assistant-create-button" aria-label="Criar Agendamento" title="Criar Agendamento" style="position:fixed;right:16px;top:16px;z-index:9999;width:44px;height:44px;border-radius:10px;border:0;background:#e1bc38;color:#111;display:grid;place-items:center;box-shadow:0 10px 24px rgba(0,0,0,0.4);">
      +
    </button>
    <script>
      (function(){
        var btn = document.getElementById('assistant-create-button');
        if(!btn) return;

        // Decide visibility: show on client Home and barber/admin dashboards.
        function updateVisibility(){
          try{
            var raw = window.location.pathname || '/';
            var path = String(raw).split('?')[0];
            // allowed pages where the floating create button should appear
            var allowed = ['/home', '/dashboard-chief', '/barber-dashboard', '/dashboard-barbeiro'];
            if (allowed.includes(path) || path.startsWith('/home')) {
              btn.style.display = 'grid';
            } else {
              btn.style.display = 'none';
            }
          }catch(e){
            btn.style.display = 'none';
          }
        }

        // Navigate to manual booking (barber manual). Admins can then pick any barber in that view.
        btn.addEventListener('click', function(){
          try{ window.location.href = '/barber-manual'; }catch(e){console.error(e)}
        });

        // Patch history methods so SPA navigation updates visibility
        (function(){
          var _wr = function(type){
            var orig = history[type];
            return function(){
              var rv = orig.apply(this, arguments);
              window.dispatchEvent(new Event('locationchange'));
              return rv;
            };
          };
          history.pushState = _wr('pushState');
          history.replaceState = _wr('replaceState');
          window.addEventListener('popstate', function(){ window.dispatchEvent(new Event('locationchange')); });
        })();

        // Update on location changes
        window.addEventListener('locationchange', updateVisibility);

        // Initial check
        updateVisibility();
      })();
    </script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
